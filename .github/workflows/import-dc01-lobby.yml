name: Import DC01 Lobby video
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct URL to the authorized Lobby video file"
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert video
        env:
          SOURCE_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          mkdir -p hss-safety-map/quest/lobby/media
          curl --fail --location --retry 3 "$SOURCE_URL" -o /tmp/lobby-input
          ffmpeg -hide_banner -loglevel error -y -i /tmp/lobby-input -map 0:v:0 -map 0:a:0? -c copy -movflags +faststart hss-safety-map/quest/lobby/media/DC01_Lobby.mp4
          test -s hss-safety-map/quest/lobby/media/DC01_Lobby.mp4
      - name: Publish video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hss-safety-map/quest/lobby/media/DC01_Lobby.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Publish DC01 Lobby walkthrough video"
          git pull --rebase origin main
          git push origin HEAD:main
