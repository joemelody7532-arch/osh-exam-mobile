name: 每日掃描職安衛歷屆試題公開索引

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'  # 10:15 Asia/Taipei (UTC+8)
  push:
    branches: [main]
    paths:
      - 'scripts/archive_refresh.py'
      - '.github/workflows/archive-refresh.yml'

permissions:
  contents: write

concurrency:
  group: archive-refresh-main
  cancel-in-progress: false

jobs:
  refresh-history-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata parser
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Scan publicly indexed exam PDF links (no copying of PDFs)
        run: python scripts/archive_refresh.py
      - name: Commit refreshed archive index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/archive-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh historical exam PDF reference index'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
