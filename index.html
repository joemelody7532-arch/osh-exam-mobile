</style></head><body><div id="app"><div class="app"><div class="topbar"><div class="brand"><span class="logo">安</span>職安考通</div></div><main class="content">正在載入題庫…</main></div></div><script>const BUNDLED_PRACTICE={"version":"2026-10-20","questions":[{"id":"P0001","type":"single","topic":"90006 職業安全衛生","specialty":"all","text":"發現工作場所有立即發生危險之虞時，最適當的處理為何？","options":["先完成手上工作","停止作業並使人員退避安全場所","拍照後等待隔天","僅提醒同事小心"],"answer":[1],"explanation":"立即危險應優先停止作業、撤離及排除危害。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0002","type":"single","topic":"90006 職業安全衛生","specialty":"all","text":"風險評估中，風險一般由哪兩個主要因素組成？","options":["成本與產值","危害發生可能性與後果嚴重度","人數與工時","溫度與濕度"],"answer":[1],"explanation":"常見風險矩陣以可能性及嚴重度評定風險。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0003","type":"single","topic":"90006 職業安全衛生","specialty":"all","text":"使用化學品前，最應優先查閱哪項資料？","options":["安全資料表（SDS）","採購發票","產品廣告","出勤紀錄"],"answer":[0],"explanation":"SDS 提供危害、保護措施、洩漏與急救資訊。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0004","type":"single","topic":"90006 職業安全衛生","specialty":"all","text":"發生事故後的調查，主要目的為何？","options":["尋找替罪羊","預防再發並改善系統缺失","僅完成行政程序","減少通報次數"],"answer":[1],"explanation":"事故調查著重根本原因與防止再發措施。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0005","type":"single","topic":"90007 工作倫理","specialty":"all","text":"發現檢查紀錄有誤，管理人員應如何處理？","options":["直接刪除整份紀錄","保留可追溯性並依程序更正","請他人代簽","為避免影響績效而不處理"],"answer":[1],"explanation":"紀錄更正應可追溯，避免偽造或掩蓋。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0006","type":"single","topic":"90007 工作倫理","specialty":"all","text":"處理員工健康資料時最重要的原則是？","options":["傳送到公開群組","依業務必要性限制存取並保護隱私","公開個人診斷","複製到私人帳號"],"answer":[1],"explanation":"健康及個資應以最小必要原則保護。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0007","type":"single","topic":"90007 工作倫理","specialty":"all","text":"承攬商要求幫忙隱匿危險作業缺失時，管理人員應？","options":["同意並換取便利","依規定通報、追蹤改善","只在口頭說明","刪除照片"],"answer":[1],"explanation":"完整揭露風險及追蹤改善符合專業倫理。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0008","type":"single","topic":"90007 工作倫理","specialty":"all","text":"評估設備安全時，哪一種做法較符合專業誠信？","options":["在未檢查前先簽合格","依現場證據及規範如實判定","只採供應商口頭承諾","為趕進度忽略試驗"],"answer":[1],"explanation":"檢查結論須基於客觀資料及實際驗證。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0009","type":"single","topic":"90008 環境保護","specialty":"all","text":"化學品洩漏流向雨水排水溝時，首要原則為何？","options":["用水沖入溝內","在安全條件下阻止擴散並通報","任其自然蒸發","以紙箱掩蓋"],"answer":[1],"explanation":"避免污染水體；在確保人員安全後阻止擴散。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0010","type":"single","topic":"90008 環境保護","specialty":"all","text":"事業廢棄物分類與處理最適合採取哪種方式？","options":["所有廢棄物混裝","依特性分類、標示並交合法管道處理","交給不明車輛","只靠容器顏色區分"],"answer":[1],"explanation":"分類、標示及合法清除處理是基本原則。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0011","type":"single","topic":"90008 環境保護","specialty":"all","text":"選擇減少污染的改善措施時，優先考量何者？","options":["源頭減量與製程改善","增加末端稀釋","移到其他地方排放","不再記錄用量"],"answer":[0],"explanation":"源頭減量優先於末端處理。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0012","type":"single","topic":"90008 環境保護","specialty":"all","text":"危害性廢棄物容器最重要的管理條件為何？","options":["保持開口方便使用","合適容器、清楚標示並防止洩漏","與一般食品存放","放在避難出口"],"answer":[1],"explanation":"防漏、標示及合適儲存可降低人員與環境危害。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0013","type":"single","topic":"90009 節能減碳","specialty":"all","text":"降低空調能源消耗的首要合理措施為何？","options":["無人區域維持全負載","改善設備效率並適當設定溫度","封閉所有通風口","取消必要的通風設備"],"answer":[1],"explanation":"節能不能犧牲法定或必要的通風安全。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0014","type":"single","topic":"90009 節能減碳","specialty":"all","text":"建立能源績效指標時，哪一項最有助於比較？","options":["用電量與產量或樓地板面積等活動量連結","只看某一天用電","只看電費帳單顏色","不用保留紀錄"],"answer":[0],"explanation":"能耗強度可協助排除產量或規模差異。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0015","type":"single","topic":"90009 節能減碳","specialty":"all","text":"改善照明能源效率時，合適的作法為何？","options":["在必要照度前提下採高效率燈具與分區控制","全部關燈","遮住緊急照明","取消出口指示燈"],"answer":[0],"explanation":"必須同時兼顧工作照度與緊急照明要求。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0016","type":"single","topic":"90009 節能減碳","specialty":"all","text":"選擇節能設備時，應避免哪一種做法？","options":["評估生命週期成本","確認符合安全規範","只因節能而拆除必要防護裝置","規劃維護保養"],"answer":[2],"explanation":"能源績效不得凌駕基本安全防護。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0017","type":"single","topic":"安全衛生管理","specialty":"all","text":"ISO 45001 的 PDCA 循環中，Check 主要對應哪項活動？","options":["鑑別危害與規劃","績效監督、測量及稽核","施行工程控制","公布公司願景"],"answer":[1],"explanation":"Check 重點在監督績效並確認系統是否有效。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0018","type":"single","topic":"安全衛生管理","specialty":"all","text":"風險控制層級中，通常優先程度最高的是？","options":["個人防護具","工程控制","消除危害","行政管理"],"answer":[2],"explanation":"消除危害優先於取代、工程、行政及個人防護。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0019","type":"single","topic":"安全衛生管理","specialty":"all","text":"承攬共同作業前，最應建立哪項機制？","options":["僅由承攬商自行決定","連繫調整、作業協調及危害告知","完全不開會","將工作全部交由門衛"],"answer":[1],"explanation":"共同作業須重視原事業單位協調和危害防止。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0020","type":"single","topic":"安全衛生管理","specialty":"all","text":"變更管理（MOC）最適合在什麼時點執行？","options":["設備變更完成後很久","作業或設備變更前先評估風險","事故後才開始","僅在驗收時"],"answer":[1],"explanation":"變更前辨識新增或改變的危害。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0021","type":"single","topic":"安全衛生管理","specialty":"all","text":"職災調查使用「五個為什麼」主要是為了？","options":["快速歸咎個人","探索事故背後的系統性原因","取代全部證據","計算保險費"],"answer":[1],"explanation":"持續追問因果，以找到可改善的根因。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0022","type":"single","topic":"安全衛生管理","specialty":"all","text":"安全衛生教育訓練成效最適合如何確認？","options":["只有簽到就視為有效","結合測驗、操作觀察與現場行為","只看出席人數","不須追蹤"],"answer":[1],"explanation":"訓練成效需要知識與行為方面的佐證。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0023","type":"single","topic":"安全衛生管理","specialty":"all","text":"在安全巡檢發現高風險缺失時，合理的處置順序為何？","options":["等月報再追蹤","先控制危害、指派改善、驗證結案","刪除缺失紀錄","只用口頭提醒"],"answer":[1],"explanation":"先控制急迫風險，後續落實改善及驗證。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0024","type":"single","topic":"安全衛生管理","specialty":"all","text":"「領先指標」的最佳例子為何？","options":["去年失能傷害件數","本月風險改善措施按期完成率","去年事故損失日數","去年工傷保險理賠額"],"answer":[1],"explanation":"改善完成率能呈現預防性活動，屬領先指標。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0025","type":"single","topic":"安全衛生管理","specialty":"all","text":"「落後指標」的例子為何？","options":["風險評估完成率","工具箱會議出席率","職業災害件數","近失事件提報率"],"answer":[2],"explanation":"事故發生後的結果屬落後指標。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0026","type":"single","topic":"安全衛生管理","specialty":"all","text":"設置安全衛生管理目標時，最適當的設計方式為何？","options":["無期限的口號","可衡量、可追蹤且有責任人與期限","避免數據","僅由承攬商決定"],"answer":[1],"explanation":"SMART 目標便於管理、檢視與改善。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0027","type":"single","topic":"安全衛生管理","specialty":"all","text":"危害辨識時，下列哪項不應忽略？","options":["僅例行作業","非例行作業、維修及緊急狀況","只有辦公室","只有承攬商作業"],"answer":[1],"explanation":"危害辨識須涵蓋不同作業模式及緊急情境。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0028","type":"single","topic":"安全衛生管理","specialty":"all","text":"採購一台新機械時，安全管理最適合提前介入哪個階段？","options":["設備停用後","規格訂定與選型階段","僅結帳時","事故發生後"],"answer":[1],"explanation":"源頭納入安全規格可減少後續改造。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0029","type":"single","topic":"安全衛生管理","specialty":"all","text":"承攬商人員進場時，哪項最適合列為必要事項？","options":["只看公司制服","危害告知與入場管制","只確認手機品牌","完全不需核實資格"],"answer":[1],"explanation":"進場前應確認作業風險、資格與管制。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0030","type":"single","topic":"安全衛生管理","specialty":"all","text":"緊急應變演練後最有價值的產出是？","options":["只拍團體照片","記錄問題、改善期限及驗證結果","演練後丟掉紀錄","只宣布結束"],"answer":[1],"explanation":"演練重點在發現應變缺口與追蹤改善。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0031","type":"single","topic":"安全衛生管理","specialty":"all","text":"工作安全分析（JSA）通常會先進行何事？","options":["直接決定罰款","將工作拆分為主要步驟","只買防護具","只設定產量"],"answer":[1],"explanation":"工作步驟拆解後辨識各步驟危害和控制措施。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0032","type":"single","topic":"安全衛生管理","specialty":"all","text":"員工提出近失事件時，組織最適合採取？","options":["鼓勵報告、分析並改善","公開指責員工","取消所有報告","視為一定無風險"],"answer":[0],"explanation":"近失事件可協助提前消除事故誘因。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0033","type":"single","topic":"安全衛生管理","specialty":"all","text":"職安衛內部稽核最主要的功能為何？","options":["取代外部主管機關","檢查系統符合性及有效性","只追求表單數量","向全體員工公布個資"],"answer":[1],"explanation":"稽核評估管理系統是否依要求執行及有效運作。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0034","type":"single","topic":"安全衛生管理","specialty":"all","text":"若改善措施已完成施工，正式結案前還應做什麼？","options":["直接刪單","驗證控制措施是否有效","停止追蹤","僅向供應商付款"],"answer":[1],"explanation":"改善完成不等於風險已充分降低。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0035","type":"single","topic":"安全衛生管理","specialty":"all","text":"對於危害性作業的工作許可制度，關鍵重點為？","options":["許可單簽完就永久有效","確認作業條件、隔離與必要的安全措施","只列印空白表","任何人都能任意修改"],"answer":[1],"explanation":"作業許可應與現場條件和措施相符。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0036","type":"single","topic":"安全衛生管理","specialty":"all","text":"若需要對多項危害排定改善優先順序，應首先參考？","options":["部門資歷","風險程度及立即危害狀況","辦公室距離","文件頁數"],"answer":[1],"explanation":"以風險為基礎配置改善資源。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0037","type":"single","topic":"安全衛生管理","specialty":"all","text":"稽核缺失的矯正措施應特別避免？","options":["確認原因","只修正表象、未處理根因","訂定期限","驗證有效性"],"answer":[1],"explanation":"只消除眼前現象，缺失容易再發。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）" ion":"集體防護優先，必要時配合個人防墜。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0108","type":"multi","topic":"火災爆炸","specialty":"safe","text":"動火作業安全準備通常包含？（複選）","options":["清除或隔離可燃物","適當滅火器材","火警監視與監火人員","容許附近容器敞開存放溶劑"],"answer":[0,1,2],"explanation":"動火需要控制點火源、可燃物及應變。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0109","type":"multi","topic":"運輸交通","specialty":"safe","text":"廠內堆高機安全管理應包含？（複選）","options":["駕駛資格與訓練","車輛檢查維護","人車動線管理","任意超速搶道"],"answer":[0,1,2],"explanation":"設備、駕駛、現場動線需整體管理。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0110","type":"multi","topic":"電氣安全","specialty":"safe","text":"電氣維修前的關鍵安全步驟包含？（複選）","options":["隔離電源","驗證無電","防止誤送電","只戴一般布手套"],"answer":[0,1,2],"explanation":"須有隔離與確認安全狀態。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0111","type":"multi","topic":"製程安全","specialty":"safe","text":"化學製程變更的風險評估宜涵蓋？（複選）","options":["操作條件變更","聯鎖及保護層","異常與緊急情境","只看採購折扣"],"answer":[0,1,2],"explanation":"製程風險控制需要系統分析。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0112","type":"multi","topic":"職業災害分析","specialty":"safe","text":"有效的事故調查報告通常涵蓋？（複選）","options":["事故事實時序","直接原因及根本原因","矯正預防措施與追蹤","只寫單一員工姓名"],"answer":[0,1,2],"explanation":"報告應能支援預防再發。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0113","type":"multi","topic":"作業環境監測","specialty":"health","text":"評估化學物暴露時通常需考慮哪些？（複選）","options":["濃度","暴露時間","暴露途徑","只看物質中文名稱"],"answer":[0,1,2],"explanation":"暴露情境涉及劑量、時間及途徑。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0114","type":"multi","topic":"化學性因子","specialty":"health","text":"呼吸防護計畫可包含哪些？（複選）","options":["危害評估與選型","適合度測試","使用及保養訓練","將濾材無限期使用"],"answer":[0,1,2],"explanation":"呼吸防護應為完整計畫而非僅採購面罩。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0115","type":"multi","topic":"局部排氣","specialty":"health","text":"局部排氣系統查核可涵蓋哪些？（複選）","options":["氣流方向","集氣罩與風管狀態","風量及捕集效果","僅聽風機是否有聲音"],"answer":[0,1,2],"explanation":"性能評估需實測而非只看設備運轉。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0116","type":"multi","topic":"物理性因子","specialty":"health","text":"預防熱危害的有效措施可包含？（複選）","options":["遮蔽熱源","補水及安排休息","熱適應訓練","增加不必要的熱負荷"],"answer":[0,1,2],"explanation":"熱危害防制通常需工程及行政整合。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0117","type":"multi","topic":"人因工程","specialty":"health","text":"評估工作相關肌肉骨骼風險，常考量？（複選）","options":["施力","姿勢","重複頻率","只看公司規模"],"answer":[0,1,2],"explanation":"人因風險受多個作業因子影響。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0118","type":"multi","topic":"職業健康","specialty":"health","text":"職業健康監護的良好做法可包含？（複選）","options":["職場危害暴露資訊","適當健康檢查與追蹤","保護個資","將個人病歷公開貼於公佈欄"],"answer":[0,1,2],"explanation":"健康監護應確保必要性、專業性及隱私。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0119","type":"multi","topic":"作業環境監測","specialty":"health","text":"採樣計畫執行前應確認？（複選）","options":["採樣目標與方法","設備校正","採樣位置及代表性","不必記錄採樣時間"],"answer":[0,1,2],"explanation":"完整方法與紀錄才能解讀結果。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"},{"id":"P0120","type":"multi","topic":"生物性危害","specialty":"health","text":"降低生物性危害的合適措施包含？（複選）","options":["標準防護","手部衛生","適當尖銳物收集容器","污染物與餐食混放"],"answer":[0,1,2],"explanation":"防護措施應配合感染風險與接觸方式。","source_type":"practice","year":null,"source":"原創練習題（不是官方考古題）"}],"subjective":[{"id":"S01","specialty":"safe","topic":"承攬管理","text":"某物流倉儲廠區夜間進行屋頂動火與高處作業。請條列辨識至少五項主要危害，並設計承攬共同作業前、中、後管理流程。","points":"危害辨識（墜落、火源、可燃物、感電、交叉作業）；工作許可與資格；危害告知／連繫調整；監視與消防備援；完工檢查及關閉許可。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S02","specialty":"safe","topic":"機械安全","text":"一台輸送機發生卡料，維修人員準備排除。請以 LOTO 原則設計安全工作步驟。","points":"辨識全部能源、停機、隔離、上鎖掛牌、釋放殘能、驗證零能量、維修、更換防護、清點人員、依程序復歸。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S03","specialty":"safe","topic":"消防與危險物","text":"倉庫同時存放紙箱、酒精類液體與鋰電池。請提出分區儲存、火源、消防、巡檢及緊急應變方面的管理重點。","points":"物質危害分類與法規確認；防火區劃；合適消防系統；危險物與電池安全管理；異常偵測；現場應變。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S04","specialty":"safe","topic":"風險評估","text":"試擬一份堆高機與行人共用通道的風險評估表，說明危害、風險評分、控制措施與後續驗證。","points":"辨識盲區、路口、倒車、速度；可能性與嚴重度；實體分流優先；速限與警示；監督成效。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S05","specialty":"health","topic":"暴露評估計算","text":"某作業勞工 2 小時接觸 80 ppm、4 小時接觸 40 ppm、2 小時接觸 10 ppm。請計算 8 小時 TWA 並說明如何與容許暴露標準比較。","points":"TWA=(80×2+40×4+10×2)/8=42.5 ppm。需取得該物質適用最新容許暴露標準，確認採樣方法、時間及防護狀況。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S06","specialty":"health","topic":"局部排氣","text":"某化學調配區的排氣設備有運轉，但員工仍反映溶劑味道。請設計局部排氣效能確認與改善程序。","points":"檢視SDS及危害；實測風量與氣流；罩口位置與污染源；風管及濾材；暴露評估；工程改善後再測。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S07","specialty":"health","topic":"噪音與高溫","text":"請規劃一個含噪音及熱危害的作業環境監測及預防改善計畫。","points":"暴露群組、現場調查與監測、風險判讀、工程控制、工作休息、個人防護、健康管理、成效驗證。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"},{"id":"S08","specialty":"health","topic":"人因工程","text":"工廠包裝人員反映肩頸與下背不適。請從調查、風險分析、控制措施到績效追蹤擬定改善方案。","points":"作業頻率與負重、姿勢與施力、員工訪談、設備輔助與工作站設計、輪調休息、醫護轉介與持續追蹤。","source_type":"practice","source":"原創術科練習題（不是正式歷屆題）"}]};const BUNDLED_SOURCES={"updated_at":"2026-10-20T00:00:00Z","entries":[{"year":2026,"roc_year":115,"certificate":"22100","session":2,"category":"學科","title":"115年 第2梯 學科試題","publisher":"勞動部技能檢定中心（職安幫索引）","url":"https://owinform.wdasec.gov.tw/ExamNet/owInform/DLowFileQ/202607060001/05/221001-1.pdf","source_type":"official_link"},{"year":2026,"roc_year":115,"certificate":"22100","session":1,"category":"學科","title":"115年 第1梯 學科","publisher":"勞動部技能檢定中心（職安幫提供索引）","url":"https://owinform.wdasec.gov.tw/ExamNet/owInform/DLowFileQ/202603160001/15/221001-1.pdf","source_type":"official_link"},{"year":2026,"roc_year":115,"certificate":"22000","session":2,"category":"學科","title":"115年 第2梯 學科試題","publisher":"勞動部技能檢定中心（職安幫索引）","url":"https://owinform.wdasec.gov.tw/ExamNet/owInform/DLowFileQ/202607060001/05/220001-1.pdf","so function dailyAttempts(){return (saved.attempts[today()]||{}).total||0}
function streak(){let n=0;const d=new Date();if(!saved.attempts[today()]?.total)d.setDate(d.getDate()-1);for(let i=0;i<366;i++){const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;if(!(saved.attempts[key]?.total))break;n++;d.setDate(d.getDate()-1)}return n}
function accuracy(){const a=saved.answers;return a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0}
function topicList(){return [...new Set(bank().map(q=>q.topic))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}

ss="emoji">✍️</span><div><strong>甲級術科</strong><small>申論・計算・作答練習</small></div></button></div><div class="notice">📚 內建 ${BUNDLED_PRACTICE.questions.length} 題「原創練習題」；${official.length} 題「官方公告學科題庫（第三方整理）」。有網路時自動檢查題庫更新，歷屆實際考卷在「歷屆」頁查閱。</div>${lawUpdatesCard()}<p class="footnote">此工具為自主備考用途；法令、命題及合格條件均以技能檢定中心最新公告為準。</p></main>`}

function archive(){const y=archiveYear;const courseEntries=archives.filter(s=>s.year===y&&s.certificate===certificate);const earliest=y<2017, latest=y>=2021;const latestYear=Math.max(new Date().getFullYear(),2026,...archives.map(s=>Number(s.year)||0));const yearOpts=Array.from({length:latestYear-2010+1},(_,i)=>latestYear-i);return `<main class="content"><h1 class="page-title">歷屆試題庫</h1><p class="page-subtitle">2010 年起至最新年度・已找到連結與尚缺資料分開呈現。</p>${selector()}<div class="card"><div class="row"><strong style="font-size:12px">考試年度</strong><select id="archiveYear" class="form-select">${yearOpts.map(v=>`<option value="${v}" ${y===v?'selected':''}>${v} 年（民國 ${v-1911} 年）</option>`).join('')}</select></div></div><div class="source-summ"><div class="card"><strong>${official.length}</strong><span>已匯入官方題庫</span></div><div class="card"><strong>${BUNDLED_PRACTICE.questions.length}</strong><span>內建原創練習題</span></div><div class="card"><strong>${archives.filter(s=>s.url).length}</strong><span>已索引試題連結</span></div></div>${cardTitle(`${y} 年公開試題連結`,`${COURSES[certificate]}`)}<div class="card">${courseEntries.length?courseEntries.slice(0,40).map(r=>`<div class="source-row"><div><div class="sr-title"><span class="status-bullet found"></span>${escapeHTML(r.title||'學術科試題')}</div><div class="sr-sub">${escapeHTML(r.publisher||'公開資料來源')} · ${escapeHTML(r.category||'PDF／試題索引')}</div></div><a href="${escapeHTML(r.url)}" target="_blank" rel="noopener noreferrer">開啟 ↗</a></div>`).join(''):`<div class="row"><div><strong style="font-size:13px">${earliest?'尚未取得已核實的公開連結': '目前無已驗證的個別檔案連結'}</strong><p class="small muted" style="margin:4px 0">${earliest?'此年度有歷年紙本整理出版，但不能視為已取得開放電子題庫。':'本單檔版沒有自動爬取歷屆試卷；缺漏需日後更新網頁。'}</p></div></div>`}</div><div class="notice ${courseEntries.length?'':'warn'}">${courseEntries.length?'綠點表示已找到可開啟的來源連結；不等於已成功解析或匯入練題。':'灰色缺漏不代表該年度沒有考試，僅表示目前未核實可公開下載的個別來源。'}</div>${certificate==='22200'&&y>=2021?`<div class="notice warn">乙級職業安全衛生管理員自 2021 年起學術科改採電腦測試，歷屆個別試卷通常不公開；建議使用官方公告學科參考題庫練習。</div>` function report(){const perDay=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;return {label:`${d.getMonth()+1}/${d.getDate()}`,count:saved.attempts[key]?.total||0}});const max=Math.max(5,...perDay.map(x=>x.count));const wrongSet=mostRecentWrong();return `<main class="content"><h1 class="page-title">學習分析</h1><p class="page-subtitle">答對率、錯題與每日練習，全部儲存在目前裝置。</p><div class="stat-pair"><div class="card"><div class="stat-val">${saved.answers.length}</div><div class="stat-caption">累積作答題次</div></div><div class="card"><div class="stat-val">${accuracy()}%</div><div class="stat-caption">整體正確率</div></div><div class="card"><div class="stat-val">${streak()} 天</div><div class="stat-caption">連續練習</div></div><div class="card"><div class="stat-val">${wrongSet.length}</div><div class="stat-caption">待複習錯題</div></div></div>${cardTitle('最近 7 天練習量')}<div class="card"><div class="bar-chart">${perDay.map(x=>`<div class="colbar"><i style="height:${x.count/max*78}px"></i><small>${x.label}</small></div>`).join('')}</div><div class="small muted">紀錄以手機當地日期統計，不跨裝置自動同步。</div></div>${cardTitle('最近練習紀錄')}<div class="card">${saved.records.length?[...saved.records].reverse().slice(0,12).map(r=>`<div class="history-row"><span>${escapeHTML(r.date.slice(0,16))}<span class="muted"> · ${escapeHTML(r.mode)}</span></span><strong>${r.score}${r.total?` / ${r.total}`:''}</strong></div>`).join(''):'<p class="muted small">完成第一次練習後就會出現成績。</p>'}</div><button class="btn primary block" data-start="wrong">重練 ${wrongSet.length} 題錯題 ↗</button></main>`}
function settings(){return `<main class="content"><h1 class="page-title">管理設定</h1><p class="page-subtitle">所有練習資料僅保存在此瀏覽器；請定期備份。</p>${selector()}${cardTitle('題庫狀態')}<div class="card"><div class="history-row"><span>原創練習題</span><strong>${BUNDLED_PRACTICE.questions.length} 題</strong></div><div class="history-row"><span>已載入的公告學科題庫</span><strong>${official.length} 題</strong></div><div class="history-row"><span>自行匯入題庫</span><strong>${saved.customQuestions.length} 題</strong></div><div class="history-row"><span>公告題庫整理來源</span><strong><a href="https://github.com/JaredSong/levelup-tw" target="_blank" rel="noopener">levelup-tw ↗</a></strong></div><div class="history-row"><span>上次同步</span><strong>${escapeHTML(saved.lastSync||'尚未同步')}</strong></div></div><button class="btn outline block" id="sync">⟳ 現在檢查更新</button>${lawUpdatesCard()}${coverageCard()}${cardTitle('個人學習備份')}<div class="mode-list"><button class="mode-item" id="export"><span class="mode-icon">⬇️</span><div><strong>匯出個人練習資料</strong><p>下載 JSON；可換機匯入恢復</p></div><span class="right-chevron">›</span></button><label class="mode-item" style="cursor:pointer"><span class="mode-icon">⬆️</span><div><strong>匯入備份或自行整理的題庫</strong><p>支援備份 JSON 或 questions 陣列</p></div><span class="right-chevron">›</span><input id="importFile" type="file" accept=".json,application/json" class="hide"></label></div>${cardTitle('部署與自動更新')}<div class="card small"><strong>iPhone 單檔版：連線時檢查公告參考題庫</strong><p>每次開啟網頁時會嘗試讀取第三方整理的公開學科參考題庫，也可按「現在檢查更新」。2010 年至最新年度的歷屆試卷連結是此版本內建的已知索引，不會自動收集最新考卷。本單檔版本不含 GitHub Actions 定時抓取；若外部整理來源停止提供或變更格式，需維護更新。</p><p class="muted">Facebook 分享連結如需登入、授權或涉及第三方著作權，系統只記錄或提供來源，不繞過登入或任意轉載。</p></div><button class="btn outline block" id="clear">清除本裝置練習紀錄</button><p class="footnote">本作品非政府官方系統，也不取代最新法規或正式考試公告。</p></main>`}
function mostRecentWrong(){const seen=new Set(), ids=[];[...saved.answers].reverse().forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);if(!x.correct)ids.push(x.id)}});return ids}
function start(mode,topic=null){let source=mode==='focus'?official:bank();let items=[];
if(mode==='wrong')source=source.filter(q=>mostRecentWrong().includes(q.id));
if(mode==='favorite')source=source.filter(q=>saved.favorites.includes(q.id));
if(mode==='focus')source=source.filter(q=>q.source_type==='official'&&q.source_code==='22000'&&reasonItemFor(q)&&topicCategory(q)===topic);
if(topic&&mode!=='focus')source=source.filter(q=>q.topic===topic);
if(mode==='mock'){
 // Prefer exclusively official-source questions whenever the full exam composition is available.
 const os=source.filter(q=>q.source_type==='official');
 const hasFullOfficial=os.filter(q=>q.type==='multi').length>=20 && ['90006','90007','90008','90009'].every(t=>os.filter(q=>q.type==='single'&&q.topic.startsWith(t)).length>=4) && os.filter(q=>q.type==='single'&&!q.topic.startsWith('900')).length>=44;
 if(hasFullOfficial)source=os;
 const singles=source.filter(q=>q.type==='single'), multis=source.filter(q=>q.type==='multi');
 const topics=['90006','90007','90008','90009'];let commons=[];
 for(const t of topics){const pack=sampled(singles.filter(q=>q.topic.startsWith(t)),4);if(pack.length!==4){toast(`缺少 ${t} 共同科目題目，無法組成正式模擬考`);return}commons.push(...pack)}
 const pros=sampled(singles.filter(q=>!topics.some(t=>q.topic.startsWith(t))&&!commons.some(c=>c.id===q.id)),44);
 const ms=sampled(multis,20);
 if(pros.length!==44||ms.length!==20){toast(`目前題庫不足 80 題完整模擬考（專業單選 ${pros.length}/44、複選 ${ms.length}/20）`);return}
 items=[...commons,...pros,...ms];
}else{items=sampled(source,mode==='daily'?target:mode==='topic'||mode==='focus'?15:source.length)}
if(!items.length){toast('此模式目前沒有可練習的題目，請更換題源或證照');return}
inSession={mode:topic?`主題｜${topic}`:({daily:'每日練習',wrong:'錯題複習',favorite:'收藏複習',mock:items.every(q=>q.source_type==='official')?'官方題庫規格模擬考':'正式規格模擬考（含原創題）'}[mode]||mode),mock:mode==='mock',ids:items.map(q=>q.id),idx:0,selection:{},checked:{},started:Date.now(),deadline:mode==='mock'?Date.now()+100*60*1000:null};examResult=null;page='quiz';persist();render()}
function questionIndex(id){return bank().find(q=>q.id===id)||BUNDLED_PRACTICE.questions.find(q=>q.id===id)||official.find(q=>q.id===id)||saved.customQuestions.find(q=>q.id===id)}
function current(){return inSession?questionIndex(inSession.ids[inSession.idx]):null}
function currPick(){const q=current();return q?(inSession.selection[q.id]||[]):[]}
function isCorrect(q,picks){return q.answer.length===picks.length&&q.answer.every(i=>picks.includes(i))}
function countScore(){if(!inSession)return {score:0,total:0};let score=0;let total=0;inSession.ids.forEach(id=>{const q=questionIndex(id);if(!q)return;const pts=inSession.mock?(q.type==='multi'?2:1):1;total+=pts;if(isCorrect(q,inSession.selection[id]||[]))score+=pts});return {score,total}}

let lawWatch=null;
function lawArticleURL(pcode,article){return pcode==='LABOR'?'https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=N0030001&flno='+article:'https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode='+encodeURIComponent(pcode)+'&flno='+article}
function lawItemFor(q){const v=String(q.id||'');return Object.keys(LEGAL_EXPLAIN).map(k=>v.endsWith(k)?LEGAL_EXPLAIN[k]:null).find(Boolean)||null}
function lawCategory(q){return /健康檢查|體格檢查|健康管理|健檢/.test(q.text)?'N0060022':/委員會|管理辦法|管理系統/.test(q.text)?'N0060027':/雇主|承攬|安全衛生/.test(q.text)?'N0060001':null}

function topicCategory(q){
 const known=reasonItemFor(q);
 if(known?.category)return known.category;
 const textValue=String(q.text||'');
 if(/承攬|再承攬|共同作業|協議組織|原事業單位|危害告知/.test(textValue))return '承攬';
 if(/職業災害|失能傷害|事故調查|災害調查|事故原因|損失日數|八小時|8\s*小時|災害類型/.test(textValue))return '事故調查';
 if(/危害辨識|風險評估|危害評估|風險控制|事件樹|故障樹|HAZOP|HazOp|初步危害分析|製程安全評估/.test(textValue))return '風險評估';
 if(/機械|起重機|升降機|鍋爐|壓力容器|捲夾|防護罩|鋸齒|砂輪|吊掛|上鎖|檢點|施工架/.test(textValue))return '機械安全';
 if(/職業安全衛生法|管理辦法|勞動基準法|委員會|罰鍰|雇主|勞工/.test(textValue))return '法規';
 return '其他';
}
const FOCUS_CATS=['法規','風險評估','承攬','機械安全','事故調查'];
function reviewCount(){
 const qs=official.filter(q=>q.source_code==='22000'&&q.source_type==='official');
 return {total:qs.length,checked:qs.filter(q=>!!reasonItemFor(q)).length,cats:FOCUS_CATS.map(name=>{
  const related=qs.filter(q=>topicCategory(q)===name);
  return {name,total:related.length,checked:related.filter(q=>!!reasonItemFor(q)).length};
 })};
}

function reasonItemFor(q){
 const id=String(q.id||'');
 const exactCode=id.startsWith('G-')?id.split('-').slice(2).join('-'):id;
 if(priorityReasons[exactCode])return priorityReasons[exactCode];
 const fromExisting=lawItemFor(q);
 if(fromExisting)return fromExisting;
 const exact=detailedReasons[id];
 if(exact)return exact;
 const match=Object.keys(detailedReasons).find(k=>id.endsWith('-'+k));
 return match?detailedReasons[match]:null;
}
function questionExamFocus(q){
 const raw=String(q.text||'');
 if(/哪些錯誤|何者錯誤|何者不正確|何者不適當|不應|最不適當|應避免/.test(raw)){
  return '⚠️ 題幹採「選錯誤／不適當」問法；應選的答案代表題目要求指出的錯誤或危險作法，不代表行為本身正確。';
 }
 if(q.type==='multi')return '複選題：需要選齊所有題庫應選項，少選或多選都不符合本系統的完整給分規則。';
 return '單選題：先抓出題幹的限定條件（例如「最適當」、「至少」、「多少人」），再排除不符合條件的選項。';
}
function legalAnalysis(q){
 const detail=reasonItemFor(q);
 const source=lawCategory(q);
 const practice=q.source_type==='practice';
 const known=!!detail;
 const reason=known?detail.note:(practice&&q.explanation?
  q.explanation:'本題只有公告題庫答案，尚無經人工核對的理由；請不要將答案索引視為現行法條的完整說明。');
 const focus=questionExamFocus(q);
 let html='<section class="legal-analysis">';
 html+='<div class="legal-heading">📖 解答理由與逐選項說明</div>';
 html+='<div class="'+(known?'legal-status':'legal-pending')+'">'+
    (known?'✓ '+escapeHTML(detail.level||'已整理的解題分析'):practice?'概念題解析：依本題內建解析整理':'待逐題核對法規')+
    (known?'｜資料整理 2026/10/20':'')+'</div>';
 html+='<div class="reason-summary"><b>為什麼這樣選？</b><p>'+escapeHTML(reason)+'</p></div>';
 html+='<p class="exam-focus">'+escapeHTML(focus)+'</p>';
 html+='<div class="reason-subtitle">A～D 個別解釋</div>';
 html+=q.options.map((_,i)=>{
  const answer=q.answer.includes(i), letter=String.fromCharCode(65+i), choice=escapeHTML(q.options[i]);
  const point=known&&Array.isArray(detail.points)?detail.points[i]:null;
  let why=point;
  if(!why&&practice&&q.explanation){
   why=answer?('依本題原創題設定的判斷原則：「'+q.explanation+'」；此選項是題目預期採取的行為或觀念。'):
     ('此選項「'+q.options[i]+'」未達成本題的判斷原則：「'+q.explanation+'」。建議對照正確選項，注意危害控制效果、行為順序或題幹的否定問法。');
  }
  if(!why)why='目前只確認題庫將此選項標為「'+(answer?'應選':'不選')+'」，尚待依政府現行條文或專業教材逐項查核具體原因。';
  return '<div class="reason-choice '+(answer?'reason-yes':'reason-no')+'">'+
    '<div class="reason-choice-top"><span>'+letter+'｜'+(answer?'本題應選':'本題不選')+'</span></div>'+
    '<div class="reason-choice-text">'+choice+'</div>'+
    '<p>'+escapeHTML(why)+'</p></div>';
 }).join('');
 const memory=known?detail.memory:(practice?reason:'');
 if(memory)html+='<div class="memory-tip"><strong>🧠 考前記憶重點</strong><p>'+escapeHTML(memory)+'</p></div>';
 if(known&&Array.isArray(detail.refs)&&detail.refs.length){
  html+='<div class="reason-subtitle">📚 相關法規依據</div><div class="legal-links">'+
  detail.refs.map(([label,code,no])=>'<a href="'+lawArticleURL(code,no)+'" target="_blank" rel="noopener noreferrer">↗ '+escapeHTML(label)+'</a>').join('')+'</div>';
 }else if(source&&LAW_BASE[source]){
  html+='<p class="legal-note">以下為可能相關的法規供自行核對，並非已確認本題適用條號：</p><a href="'+LAW_BASE[source].url+'" target="_blank" rel="noopener noreferrer">↗ '+escapeHTML(LAW_BASE[source].name)+'</a>';
 }
 if(!known&&!practice)html+='<p class="legal-pending">本題的其他選項尚無逐項實質理由，不能只根據答案位置推論法條。後續可增補經審查的詳解資料。</p>';
 if(source==='N0060022'||String(q.id).endsWith('22000-03-222'))html+='<p class="legal-alert">⚠️ 修法提醒：勞工健康保護規則於115/6/26修正，部分條文至116年或117年才施行。舊題應確認考試當天生效的條文。</p>';
 html+='</section>';
 return html;
}

="btn primary block" data-next>${i===all-1?'完成本次練習':'下一題 →'}</button>`}</div>${mock?`<div class="row"><button class="btn outline" data-prev ${i===0?'disabled':''}>← 上一題</button><button class="btn soft" data-finish>交卷並計算成績</button></div>`:`<p class="footnote">本模式可立即看答案；正式模擬考則於交卷後統一公布成績。</p>`}</main>`}
function recordAnswer(q,picks,correct){saved.answers.push({id:q.id,date:today(),course:certificate,correct,topic:q.topic,source_type:q.source_type||'practice'});const rec=saved.attempts[today()]||{total:0,correct:0};rec.total++;rec.correct+=+correct;saved.attempts[today()]=rec}
function checkAnswer(){if(!inSession||inSession.mock)return;const q=current(),picks=currPick();if(!picks.length)return;if(inSession.checked[q.id])return;inSession.checked[q.id]=true;recordAnswer(q,picks,isCorrect(q,picks));persist();render()}
function nextQuestion(){if(!inSession)return;if(inSession.idx>=inSession.ids.length-1){finish();return}inSession.idx++;persist();render()}
function finish(){if(!inSession)return;const s=countScore();if(inSession.mock){for(const id of inSession.ids){const q=questionIndex(id),p=inSession.selection[id]||[];if(q&&p.length)recordAnswer(q,p,isCorrect(q,p))}}
 examResult={...s,mode:inSession.mode,count:inSession.ids.length,certificate,date:new Date().toLocaleString('zh-TW'),pass:inSession.mock&&s.score>=60,wasMock:inSession.mock,wrong:inSession.ids.filter(id=>{const q=questionIndex(id);return q&&!isCorrect(q,inSession.selection[id]||[])})};saved.records.push({date:examResult.date,mode:inSession.mode,score:s.score,total:s.total,course:certificate});if(saved.records.length>100)saved.records=saved.records.slice(-100);inSession=null;persist();page='result';render()}
function result(){const r=examResult;if(!r){page='home';return home()}const pct=r.total?Math.round(r.score/r.total*100):0;return `<main class="content"><div style="text-align:center;padding:20px 0 5px"><div class="result-dot">${r.wasMock?(r.pass?'🏅':'📖'):'🎉'}</div><h1 class="page-title">練習完成！</h1><p class="page-subtitle">${escapeHTML(r.mode)} · ${escapeHTML(r.date)}</p></div><div class="card" style="padding:25px 20px"><div class="score">${r.score}<small> / ${r.total} 分</small></div><p class="muted small" style="text-align:center">正確率 ${pct}% ・ 錯題 ${r.wrong.length} 題</p>${r.wasMock?`<div class="notice ${r.pass?'':'warn'}" style="text-align:center">依學科 60 分模擬門檻：${r.pass?'達標':'尚未達標'}（非正式考試成績）</div>`:''}</div><div class="mode-list"><button class="mode-item" data-start="wrong"><span class="mode-icon">🔁</span><div><strong>複習錯題</strong><p>重新練習最近做錯的題目</p></div><span class="right-chevron">›</span></button><button class="mode-item" data-page="report"><span class="mode-icon">📈</span><div><strong>檢視學習分析</strong><p>最近 7 天趨勢與答題紀錄</p></div><span class="right-chevron">›</span></button></div><button class="btn outline block" style="margin-top:16px" data-page="home">返回首頁</button></main>`}
function subjScreen(){const qs=BUNDLED_PRACTICE.subjective.filter(q=>q.specialty===(certificate==='22100'?'health':'safe'));const idx=Number(saved.subjIdx||0)%qs.length,q=qs[idx];return `<main class="content"><div class="row"><h1 class="page-title">甲級術科練習</h1><button class="btn outline" data-page="home">返回</button></div><p class="page-subtitle">${certificate==='22200'?'目前選取乙級：此處示範甲級術科，請切換甲安／甲衛。':'申論與計算題・自行核對重點'}</p><div class="card"><div class="quiz-labels"><span class="tag">原創模擬題</span><span class="tag">${escapeHTML(q.topic)}</span><span class="tag">${idx+1} / ${qs.length}</span></div><div class="quiz-question">${escapeHTML(q.text)}</div><textarea class="input-area" id="subjectAnswer" placeholder="在這裡練習寫出解題架構、計算步驟或作業流程……">${escapeHTML(saved.subjectDrafts?.[q.id]||'')}</textarea><p class="small muted">可隨時儲存草稿；此題不是官方術科原題，也不會自動判斷申論題是否正確。</p><button class="btn outline block" id="saveDraft">儲存答案</button><details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-weight:850">展開參考作答重點</summary><p class="check-answers">${escapeHTML(q.points)}</p></details></div><div class="row"><button class="btn outline" id="subjPrev">← 上一題</button><button class="btn primary" id="subjNext">下一題 →</button></div></main>`}
function build(){let body={home,practice,archive,report,settings,quiz:questionScreen,result,subjective:subjScreen}[page]||home;show('app',`<div class="app">${buildHeader()}${body()}${tabs()}</div>`);document.title=`職安考通｜${page==='quiz'?'作答中':COURSES[certificate]}`;attach();if(page==='quiz'&&inSession?.deadline){clearInterval(window.__examTicker);window.__examTicker=setInterval(()=>{if(page!=='quiz'||!inSession||!inSession.deadline){clearInterval(window.__examTicker);return}let secs=Math.max(0,Math.floor((inSession.deadline-Date.now())/1000)),n=document.getElementById('countdown');if(n)n.textContent=`${pad(Math.floor(secs/60))}:${pad(secs%60)}`;if(secs<=0){clearInterval(window.__examTicker);toast('時間到，已自動交卷');finish()}},500)}else clearInterval(window.__examTicker)}
function render(){build();window.scrollTo({top:0,behavior:'instant'})}
function chooseOption(k){const q=current();if(!q||(!inSession.mock&&inSession.checked[q.id]))return;let choices=inSession.selection[q.id]||[];if(q.type==='single')choices=[k];else choices=choices.includes(k)?choices.filter(v=>v!==k):[...choices,k].sort((a,b)=>a-b);inSession.selection[q.id]=choices;persist();renderPreserve()}
function renderPreserve(){const pos=window.scrollY;build();window.scrollTo(0,pos)}
async function updateCloud(arg){
 const silent=arg===true,course=certificate;
 // iPhone single-file edition: live question bank check when the page opens
 // or when manually triggered. This edition does NOT include a scheduled crawler.
 const count=await refreshLiveBank(course,silent);
 if(!silent){toast(count?`公開參考題庫已同步：${count} 題；歷屆試卷索引為本版內建清單`:'未取得新題庫；已保留內建題與先前儲存的題目');render();}
}
function validQuestion(q){return q&&typeof q.text==='string'&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=6&&Array.isArray(q.answer)&&q.answer.length>=1&&q.answer.every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length)&&typeof q.id==='string'&&typeof q.topic==='string'}
function exportJSON(){const out={type:'osh_exam_backup',exported:new Date().toISOString(),data:{...saved,session:null}};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`職安考通_練習備份_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function importJSON(file){try{const data=JSON.parse(await file.text());if(data.type==='osh_exam_backup'&&data.data){if(!confirm('確定匯入備份？將取代目前本裝置的學習進度。'))return;saved=Object.assign(saved,data.data);certificate=COURSES[saved.course]?saved.course:'22000';inSession=null;toast('學習紀錄匯入成功');persist();render();return}
 const qs=Array.isArray(data)?data:data.questions;if(!Array.isArray(qs))throw Error('JSON 格式錯誤');const good=qs.filter(validQuestion).map((q,i)=>({...q,id:`CUSTOM-${Date.now()}-${i}`,source_type:'custom',specialty:q.specialty||'all',explanation:q.explanation||'自訂題目，請自行確認答案。'}));if(!good.length)throw Error('沒有可用題目');saved.customQuestions.push(...good);persist();toast(`已匯入 ${good.length} 題自訂題目`);render()}catch(e){toast('匯入失敗：'+e.message)}}
function attach(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{page=el.dataset.page;render()}));document.getElementById('resume')?.addEventListener('click',()=>{page='quiz';render()});document.getElementById('course')?.addEventListener('change',e=>{certificate=e.target.value;official=cachedPublicBank(certificate);inSession=null;persist();render();refreshLiveBank(certificate,true)});document.querySelectorAll('[data-target]').forEach(el=>el.addEventListener('click',()=>{target=+el.dataset.target;persist();render()}));document.querySelectorAll('[data-start]').forEach(el=>el.addEventListener('click',()=>start(el.dataset.start)));document.querySelectorAll('[data-focus]').forEach(el=>el.addEventListener('click',()=>start('focus',el.dataset.focus)));document.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>start('topic',el.dataset.topic)));document.getElementById('bankFilter')?.addEventListener('change',e=>{bankFilter=e.target.value;render()});document.getElementById('archiveYear')?.addEventListener('change',e=>{archiveYear=+e.target.value;render()});document.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click',()=>chooseOption(+el.dataset.opt)));document.querySelector('[data-check]')?.addEventListener('click',checkAnswer);document.querySelector('[data-next]')?.addEventListener('click',nextQuestion);document.querySelector('[data-prev]')?.addEventListener('click',()=>{inSession.idx=Math.max(0,inSession.idx-1);persist();render()});document.querySelector('[data-finish]')?.addEventListener('click',()=>{if(confirm('確定交卷？未作答的題目計為 0 分。'))finish()});document.querySelector('[data-exit]')?.addEventListener('click',()=>{if(inSession?.mock&&!confirm('離開後可繼續，但計時不會暫停。確定離開？'))return;page='home';persist();render()});document.getElementById('bookmark')?.addEventListener('click',()=>{const id=current().id;saved.favorites=saved.favorites.includes(id)?saved.favorites.filter(v=>v!==id):[...saved.favorites,id];persist();renderPreserve()});document.getElementById('sync')?.addEventListener('click',updateCloud);document.getElementById('export')?.addEventListener('click',exportJSON);document.getElementById('importFile')?.addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0])});document.getElementById('clear')?.addEventListener('click',()=>{if(!confirm('確定清空練習紀錄與錯題？此操作無法復原。'))return;saved.answers=[];saved.records=[];saved.attempts={};saved.favorites=[];inSession=null;persist();render();toast('已清除練習紀錄')});document.getElementById('saveDraft')?.addEventListener('click',()=>{const qs=BUNDLED_PRACTICE.subjective.filter(q=>q.specialty===(certificate==='22100'?'health':'safe')),q=qs[Number(saved.subjIdx||0)%qs.length];saved.subjectDrafts=saved.subjectDrafts||{};saved.subjectDrafts[q.id]=document.getElementById('subjectAnswer').value;persist();toast('已儲存術科作答草稿')});for(const [id,delta] of [['subjPrev',-1],['subjNext',1]])document.getElementById(id)?.addEventListener('click',()=>{const qs=BUNDLED_PRACTICE.subjective.filter(q=>q.specialty===(certificate==='22100'?'health':'safe'));const idx=Number(saved.subjIdx||0)%qs.length;saved.subjectDrafts=saved.subjectDrafts||{};saved.subjectDrafts[qs[idx].id]=document.getElementById('subjectAnswer').value;saved.subjIdx=(idx+delta+qs.length)%qs.length;persist();render()})}
if(saved.session&&saved.session.ids?.length){inSession=saved.session;if(inSession.deadline&&inSession.deadline<Date.now()){examResult=null;const backup=inSession;inSession=backup;finish()}else{page='home';}}
render();
updateCloud(true);
loadLawReport();
loadDetailedReasons();
loadPriorityExplanations();
// Single-file edition: no service worker asset needed.
})();
</script></body></html>
